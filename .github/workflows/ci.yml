name: CI

# All jobs run on GitHub's own runners. Workflows from outside contributors
# wait for the owner's approval (Settings → Actions → General).
#
# The audit job checks Cargo.lock against the RustSec advisory database, on
# every push and pull request and once a week, so an advisory published for an
# unchanged Cargo.lock still shows up. It is a separate job, not part of the
# two checks main and Dev require, so a new advisory flags the problem without
# blocking unrelated merges. The weekly run does only the audit.

on:
  push:
    branches: [main, Dev]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC: audit only

permissions:
  contents: read

concurrency:
  # Per event too, so the weekly audit and a push to main don't cancel each other.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test, build)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        # The tests write a small cache under $HOME; give them a throwaway home.
        run: |
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          mkdir -p "$RUNNER_TEMP/home"
          HOME="$RUNNER_TEMP/home" cargo test --locked

      - name: Build (release)
        run: cargo build --release --locked

  app:
    name: macOS app (test, build, verify)
    if: github.event_name != 'schedule'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - name: Show tools
        run: |
          sw_vers
          xcodebuild -version
          cargo --version

      - name: Rust tests on macOS
        run: cargo test --release --locked

      - name: Build app
        # The Xcode project builds and embeds the Rust core itself. Ad-hoc
        # signed ("-"): CI only needs to prove the app builds.
        run: |
          xcodebuild -project Termight/Termight.xcodeproj -scheme Termight \
            -configuration Release -derivedDataPath "$RUNNER_TEMP/derived" -quiet build \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=

      - name: Verify app
        run: |
          app="$RUNNER_TEMP/derived/Build/Products/Release/Termight.app"
          codesign --verify --deep --strict "$app"
          test -x "$app/Contents/MacOS/termight-core"
          "$app/Contents/MacOS/termight-core" 'echo core runs'
          # Both Spotlight actions must be in the extracted App Intents metadata.
          grep -q RunCommandIntent "$app/Contents/Resources/Metadata.appintents/extract.actionsdata"
          grep -q RunSnippetIntent "$app/Contents/Resources/Metadata.appintents/extract.actionsdata"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/Termight.app.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Termight.app
          path: ${{ runner.temp }}/Termight.app.zip
          retention-days: 7
          if-no-files-found: error

  audit:
    name: Audit (RustSec advisories)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      # Third-party audit actions aren't on this repository's allowed list, so
      # the tool is built with cargo (about 3 minutes) and cached by version.
      - name: Cache cargo-audit
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-0.23.0-${{ runner.os }}

      - name: Install cargo-audit
        if: steps.cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version 0.23.0 --locked

      - name: Audit Cargo.lock
        # Fails on a crate with a known vulnerability; warnings (unmaintained,
        # yanked) are printed but don't fail the job.
        run: cargo audit
